services:
  ztf-db:
    image: postgres:15-alpine
    command: >
      postgres
      -c max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ztf_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  ztf-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_HOST: ztf-db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      NODE_ENV: production
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ztf-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  ztf-caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./setup:/usr/share/caddy/setup:ro
      - ./Caddyfile:/etc/caddy/Caddyfile
    restart: unless-stopped

volumes:
  ztf_pgdata:
